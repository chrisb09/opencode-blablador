<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="730" viewBox="0 0 1000 730" role="img" aria-labelledby="title desc">
  <title id="title">Live endpoint time to first token</title>
  <desc id="desc">Time to first token in milliseconds for ten Blablador models, on a logarithmic axis from 10 to 100000 milliseconds. GLM-5.3-Flash took 24546 milliseconds in one sample.</desc>
  <rect width="1000" height="730" fill="#f8fafc"/>
  <text x="55" y="43" fill="#102a43" font-family="sans-serif" font-size="27" font-weight="700">Time to first token</text>
  <text x="55" y="70" fill="#486581" font-family="sans-serif" font-size="16">Blablador endpoints · one streaming sample per model · lower is better</text>
  <text x="80" y="104" fill="#243b53" font-family="sans-serif" font-size="15" font-weight="700">TTFT (ms) · logarithmic scale, baseline 10 ms</text>
  <g stroke="#d9e2ec"><path d="M80 120H970 M80 195H970 M80 270H970 M80 345H970 M80 420H970"/></g>
  <g fill="#486581" font-family="sans-serif" font-size="14" text-anchor="end">
    <text x="70" y="425">10</text><text x="70" y="350">100</text><text x="70" y="275">1,000</text><text x="70" y="200">10,000</text><text x="70" y="125">100,000</text>
  </g>
  <path d="M80 120V420H970" fill="none" stroke="#627d98"/>
  <g fill="#365f9c">
    <rect x="103" y="339.06" width="48" height="80.94"/><rect x="191" y="351.46" width="48" height="68.54"/><rect x="279" y="338.77" width="48" height="81.23"/><rect x="367" y="317.86" width="48" height="102.14"/><rect x="455" y="322.59" width="48" height="97.41"/><rect x="543" y="165.75" width="48" height="254.25"/><rect x="631" y="294.88" width="48" height="125.12"/><rect x="719" y="345" width="48" height="75"/><rect x="807" y="289.97" width="48" height="130.03"/><rect x="895" y="339.36" width="48" height="80.64"/>
  </g>
  <g fill="#102a43" font-family="sans-serif" font-size="14" font-weight="700" text-anchor="middle">
    <text x="127" y="331">120</text><text x="215" y="343">82</text><text x="303" y="331">121</text><text x="391" y="310">230</text><text x="479" y="315">199</text><text x="567" y="158">24,546</text><text x="655" y="287">466</text><text x="743" y="337">100</text><text x="831" y="282">542</text><text x="919" y="331">119</text>
  </g>
  <g fill="#243b53" font-family="sans-serif" font-size="14" text-anchor="end">
    <text transform="translate(127 438) rotate(-55)">GPT-OSS-120B</text><text transform="translate(215 438) rotate(-55)">Qwen3.8-Flash-Next-NVFP4</text><text transform="translate(303 438) rotate(-55)">Qwen3.8-27B-FP8</text><text transform="translate(391 438) rotate(-55)">DeepSeek-V4.1-Flash-1017</text><text transform="translate(479 438) rotate(-55)">MiMo-V2.6-Flash-RL</text><text transform="translate(567 438) rotate(-55)">GLM-5.3-Flash</text><text transform="translate(655 438) rotate(-55)">Kimi-K3-1M</text><text transform="translate(743 438) rotate(-55)">DeepSeek-V4.1-Flash-HZDR</text><text transform="translate(831 438) rotate(-55)">Muse-Spark-Open-816B-A42B</text><text transform="translate(919 438) rotate(-55)">Swift-1.5-Qwen3.8-27B</text>
  </g>
  <text x="55" y="710" fill="#486581" font-family="sans-serif" font-size="14">Logarithmic heights encode ratios, not differences; the GLM sample needs repetition.</text>
</svg>
